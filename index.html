<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 For my Pookist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Alexa (aka my pook), will you be my valentine? 💖</h1>

    <div class="media">
      <img id="gif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="Cute gif" />
    </div>

    <p id="subtitle">Choose wisely 😌</p>

    <div class="buttons" id="arena">
      <button id="yesBtn" class="btn yes">Yes!! 💘</button>
      <button id="noBtn" class="btn no">No 😶</button>
    </div>

    <p class="hint">P.S. The “No” button is… shy.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
